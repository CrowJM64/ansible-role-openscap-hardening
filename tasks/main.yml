- name: Evaluate OpenSCAP Changes (RHEL10)
  ansible.builtin.shell:
    cmd: oscap xccdf eval --profile xccdf_org.ssgproject.content_profile_cis --results /root/openscap_hardening_results.xml /usr/share/xml/scap/ssg/content/ssg-rhel10-ds.xml
    executable: /bin/bash
  when:
    - ansible_distribution != "Rocky" or ansible_distribution != "CentOS"
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version == "10"
    - openscap_installed is succeeded
  register: openscap_evaluated
  failed_when:
    - openscap_evaluated.rc != 0
    - openscap_evaluated.rc != 2

- name: Evaluate OpenSCAP Changes (RHEL10)
  ansible.builtin.shell:
    cmd: oscap xccdf eval --profile xccdf_org.ssgproject.content_profile_cis --results /root/openscap_hardening_results.xml /usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml
  when:
    - ansible_distribution != "Rocky" or ansible_distribution != "CentOS"
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version == "9"
    - openscap_installed is succeeded
  register: openscap_evaluated
  failed_when:
    - oscap_result.rc != 0
    - oscap_result.rc != 2

- name: Generate Needed Changes Report
  ansible.builtin.shell:
    cmd: oscap xccdf generate report --output /root/openscap_report.html /root/openscap_hardening_results.xml
  when: 
    - ansible_os_family == "RedHat"
    - openscap_evaluated is succeeded
  register: openscap_reported

- name: Remediate OpenSCAP Findings (RL10)
  ansible.builtin.shell:
    cmd: oscap xccdf eval --remediate --profile xccdf_org.ssgproject.content_profile_cis --results /root/openscap_hardening_results.xml --report /root/openscap_report.html /usr/share/xml/scap/ssg/content/ssg-rl10-ds.xml
  when:
    - ansible_distribution == "Rocky"
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version == "10"
    - openscap_reported is succeeded
  register: openscap_remediated
  failed_when:
    - openscap_remediated.rc != 0
    - openscap_remediated.rc != 2

