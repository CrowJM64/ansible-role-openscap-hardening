---
# RHEL OpenSCAP Hardening
- name: Installing OpenSCAP, Security Guides and Lynx
  ansible.builtin.package:
    name:
      - openscap-scanner
      - scap-security-guide
      - lynx
    state: latest
  when: ansible_os_family == "RedHat"
  register: openscap_installed

- name: Evaluate OpenSCAP Changes (RL10)
  ansible.builtin.shell:
    cmd: oscap xccdf eval --profile xccdf_org.ssgproject.content_profile_cis --results /root/openscap_hardening_results.xml /usr/share/xml/scap/ssg/content/ssg-rl10-ds.xml
    executable: /bin/bash
  when: 
    - ansible_distribution == "Rocky"
    - ansible_distribution_major_version == "10"
    - openscap_installed is succeeded
  register: openscap_evaluated
  failed_when:
    - openscap_evaluated.rc != 0
    - openscap_evaluated.rc != 2

- name: Evaluate OpenSCAP Changes (RL9)
  ansible.builtin.shell:
    cmd: oscap xccdf eval --profile xccdf_org.ssgproject.content_profile_cis --results /root/openscap_hardening_results.xml /usr/share/xml/scap/ssg/content/ssg-rl9-ds.xml
  when:
    - ansible_distribution == "Rocky"
    - ansible_distribution_major_version == "9"
    - openscap_installed is succeeded
  register: openscap_evaluated
  failed_when:
    - oscap_result.rc != 0
    - oscap_result.rc != 2

